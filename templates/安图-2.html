                <h1>长白山是我国三大中草药材库之一，安图县被国家确定为“绿色中药材出口基地县”，被省政府列为北药基地县之一。现已经发现的药用植物800余种,其中人参等名贵药材670多种，临床常用的传统中药材就有155种。
