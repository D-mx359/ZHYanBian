<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机滚动文本</title>
<style>
body{
    background:url("/static/imgs/longjing.png");
    background-repeat: no-repeat;
    background-size:   100vw 100vh;
}    
.title {
  position: absolute;
  top: 0%; /* 相对于父容器的位置 */
  left: 50%; /* 水平居中 */
  transform: translateX(-50%); /* 居中定位 */
  text-align: center; /* 文字居中 */
  font-size: 24px; /* 字体大小 */
  font-family: Arial, sans-serif; /* 字体 */
  color:black;
}

/* 设置返回按钮的样式 */
.return-button {
  position: absolute;
  top: 10px; /* 相对于父容器的位置 */
  right: 30px; /* 距离右边框10px */
  font-size: 25px; /* 字体大小 */
  font-family: Arial, sans-serif; /* 字体 */
  cursor: pointer; /* 鼠标样式为手型 */
  a{
    display: inline-block;  
    text-decoration: none;
    color: black;
  }
  a:hover{
    color: #f48003;
  }
}

/* 设置段落文字的样式 */
.paragraph {
  position: absolute;
  top: 25%; /* 相对于父容器的位置 */
  left: 50%; /* 水平居中 */
  transform: translate(-50%, -50%); /* 居中定位 */
  text-align: left; /* 文字居中 */
  font-size: 25px; /* 字体大小 */
  font-family: Arial, sans-serif; /* 字体 */
  color: black;
}

/* 设置滚动容器的样式 */
.scroll-container {
  position: fixed;
  bottom: 0; /* 位于页面底部 */
  left: 0;
  width: 100%;
  height: 50%; /* 限制容器高度为页面高度的一半 */
  overflow: hidden; /* 隐藏超出部分 */
}

/* 设置文本的样式 */
.scroll-text {
  white-space: nowrap; /* 防止文本换行 */
  animation: scrollText 5s linear infinite; /* 使用动画让文本滚动 */
}

/* 定义文本滚动的动画 */
@keyframes scrollText {
  from {
    transform: translateX(100%); /* 从容器底部开始 */
  }
  to {
    transform: translateX(-100%); /* 滚动到容器顶部 */
  }
}
</style>
</head>
<body>
    <div class="title">
        <h1>龙井市（中国朝鲜语:룡정시）</h1>
      </div>
      
    <div class="return-button" >
      <a href="{{ url_for('longjing') }}">返回</a>
    </div>

    <div class="paragraph">
        <p>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;隶属吉林省延边朝鲜族自治州，
            位于吉林省东部，
            延边朝鲜族自治州东北部，
            吉黑两省交界处，
            幅员面积9016平方千米，
            是吉林省区域面积第二大县，
            下辖8个镇、1个乡、3个街道。
        </p>
    </div>

<div class="scroll-container" id="scroll-container"></div>

<script>
// 获取滚动容器
var container = document.getElementById('scroll-container');

// 定义可选的文本内容、颜色和字体大小
var texts = [
    "天佛指山国家级自然保护区",
    "明东尹东柱故居",
    "马蹄山旅游度假区",
    "琵岩山",
    "琵岩朝鲜艺术馆",
    "苹果梨万亩果园",
    "东方熊乐园",
    "光东村",
    "井泉",
    "龙井朝鲜族民俗博物馆",
    "正觉寺",
    "口岸城市",
    "三合",
    "开山屯",
    "良田百世运动假日景区",
    "江米鸡饭",
    "龙井湖"
];

shuffleArray(texts);

// 逐个添加文本并设置随机样式
texts.forEach(function(text, index) {
  
  setTimeout(function() {
    var scrollText = document.createElement('div');
    scrollText.textContent = text;
    scrollText.classList.add('scroll-text');
    // 设置随机位置
    var randomX = Math.floor(Math.random() * (window.innerWidth - 100)) + 'px'; // 随机水平位置
    var randomY = Math.floor(Math.random() * (window.innerHeight / 2)) + (window.innerHeight / 2) + 'px'; // 随机垂直位置
    scrollText.style.left = randomX;
    scrollText.style.top = randomY;
    // 设置随机颜色和字体大小
    var r = Math.floor(Math.random() * 76) + 180;
    var g = Math.floor(Math.random() * 76) + 180;
    var b = Math.floor(Math.random() * 76) + 180;
    // 将 RGB 值组合成颜色字符串
    var randomColor = 'rgb(' + r + ',' + g + ',' + b + ')';
    var minSize = 24; // 最小字体大小
    var maxSize = 60;
    var fontSize = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
    var randomFontSize = fontSize + 'px';
    scrollText.style.textShadow = '2px 2px 4px rgba(0,0,0,0.5)'; 
    scrollText.style.color = randomColor;
    scrollText.style.fontSize = randomFontSize;
    container.appendChild(scrollText);
  }, index * 3000); // 设置每段文本的延迟时间为3秒
});

function shuffleArray(array) {
  for (var i = array.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = array[i];
    array[i] = array[j];
    array[j] = temp;
  }
}

</script>

</body>
</html>
