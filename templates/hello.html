<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧延边——旅韵数据漫游志</title>
    <style>
        body {
            background-image: url('/static/imgs/new.jfif');
            background-size:   100vw 100vh;
            background-repeat: no-repeat; 
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        h1 {
            color: #333;
            text-align: center;
            font-size: 30px;
        }

        .description {
            margin-bottom: 20px;
        }

        .btn-container {
            text-align: center;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
        p{
            font-size: 20px;
        }
        /* @keyframes fadeIn {
            from {
                opacity: 0; 
            }
            to {
                opacity: 1; 
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        p {
            animation: fadeIn 2s ease-in-out;
            animation-fill-mode: forwards; 
        } 

        p:hover {
            animation: fadeOut 2s ease-in-out; 
            animation-fill-mode: forwards;
        } */

        .animated-text {
            display: inline-block;
            overflow: hidden;
        }

        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(100%);
            animation: bounce 0.5s forwards ease-in-out;
        }

        @keyframes bounce {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>智慧延边——旅韵数据漫游志</h1>
        <div class="description">
            <!-- <p><span class="animated-text">在遥远的东北边陲，有一片神秘而美丽的土地。</span></p>
            <p><span class="animated-text">让我们踏上这片土地，开启属于自己的奇幻之旅。</span></p> -->
            <p><span class="animated-text">万里风尘客意浓，登临有幸睹真容。</span></p>
            <p><span class="animated-text">冰湖一面云中镜，林海千涛脚下峰。</span></p>
            <p><span class="animated-text">王母遗珠留史话，火山胜迹溯陈踪。</span></p>
            <p><span class="animated-text">眼前气象瞬间异，谈笑兴游四季逢。</span></p>
            <p><span class="animated-text">让我们踏上这片土地，开启属于自己的奇幻之旅。</span></p>
        </div>
        <div class="btn-container">
            <a href="{{ url_for('data') }}" class="btn">开始体验</a>
        </div>
    </div>
    <script>
        // 获取所有需要动画的段落
        const paragraphs = document.querySelectorAll('.animated-text');

        // 对每个段落进行处理
        paragraphs.forEach(paragraph => {
            // 获取段落的文本内容
            const text = paragraph.textContent.trim();
            // 清空段落内容
            paragraph.innerHTML = '';

            // 对每个字符创建 span 元素，并添加到段落中
            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                span.classList.add('letter');
                span.textContent = text[i];
                // 设置延迟时间
                span.style.animationDelay = `${i * 0.1}s`;
                paragraph.appendChild(span);
            }
        });
    </script>
</body>
</html>
